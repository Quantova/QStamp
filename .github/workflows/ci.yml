name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPLATES_REPOSITORY: Quantova/Qstamp-Quanta-Smart-contract-example-
  TEMPLATES_COMMIT: e99ba439ec1d327f63980fbc1f25dc7127ff90e7

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: install
        run: npm ci --ignore-scripts
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: advisories
        run: npm audit --audit-level=low

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.TEMPLATES_REPOSITORY }}
          ref: ${{ env.TEMPLATES_COMMIT }}
          path: templates
          persist-credentials: false
      - name: the templates must be at the pinned commit
        run: |
          set -euo pipefail
          have=$(git -C templates rev-parse HEAD)
          if [ "$have" != "$TEMPLATES_COMMIT" ]; then
            echo "the templates are at $have, the pinned commit is $TEMPLATES_COMMIT" >&2; exit 1
          fi
      - name: rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: rebuild the contract container and the issuer and council template interfaces from source
        env:
          QSTAMP_TEMPLATES_DIR: ${{ github.workspace }}/templates
        run: bash scripts/build-contract.sh

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          ver=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gl.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: secret scan over full history
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gitleaks.toml <<'TOML'
          title = "quantova secret scan"
          [extend]
          useDefault = true
          [allowlist]
          description = "public, example, and checksum data that is not a secret"
          paths = [
            '''(^|/)package-lock\.json$''',
            '''(^|/)contract/QStamp\.qbc\.sha256$''',
          ]
          regexes = [
            '''^[Qq]1[0-9A-Za-z]{25,}$''',
            '''QTX1[0-9A-Z]{20,}''',
            '''QBK1[0-9A-Z]{20,}''',
          ]
          TOML
          gitleaks detect --source . --no-banner --redact --config /tmp/gitleaks.toml
