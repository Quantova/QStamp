name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  TEMPLATES_REPOSITORY: Quantova/Qstamp-Quanta-Smart-contract-example-
  TEMPLATES_COMMIT: 086c464046cdfebcec040980777add936ba4d00c

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TEMPLATES_REPOSITORY }}
          ref: ${{ env.TEMPLATES_COMMIT }}
          path: templates
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: the tag must name the version being published
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "publish runs only from a vX.Y.Z tag, refusing $GITHUB_REF" >&2; exit 1 ;;
          esac
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not name package version $declared" >&2; exit 1
          fi
      - name: the templates must be at the pinned commit
        run: |
          set -euo pipefail
          have=$(git -C templates rev-parse HEAD)
          if [ "$have" != "$TEMPLATES_COMMIT" ]; then
            echo "the templates are at $have, the pinned commit is $TEMPLATES_COMMIT" >&2; exit 1
          fi
      - name: test
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
          npm test
          npm audit --audit-level=low
      - name: rebuild the contract container and the issuer and council template interfaces from source
        env:
          QSTAMP_TEMPLATES_DIR: ${{ github.workspace }}/templates
        run: bash scripts/build-contract.sh

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: the tagged commit must be on main and the tag must name the package version
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "publish runs only from a vX.Y.Z tag, refusing $GITHUB_REF" >&2; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tagged commit $GITHUB_SHA is not on main, refusing to publish it" >&2; exit 1
          fi
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not name package version $declared" >&2; exit 1
          fi
      - name: npm must support trusted publishing
        run: |
          set -euo pipefail
          have=$(npm --version)
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " cannot publish with trusted publishing, 11.5.1 or later is needed"); process.exit(1); }
          ' "$have"
      - name: publish the verified commit with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --provenance --access public --ignore-scripts
      - name: the published version must carry provenance for this tag and commit
        env:
          PKG: "@quantovainc/qstamp"
          WORKFLOW_PATH: .github/workflows/publish.yml
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          url=""
          for _ in $(seq 1 120); do
            url=$(npm view "$PKG@$V" dist.attestations.url 2>/dev/null || true)
            [ -n "$url" ] && break
            sleep 10
          done
          [ -n "$url" ] || { echo "$PKG@$V shows no provenance attestation" >&2; exit 1; }
          integrity=$(npm view "$PKG@$V" dist.integrity)
          for _ in $(seq 1 40); do
            curl -sSf "$url" -o "$RUNNER_TEMP/attestations.json" 2>/dev/null && break
            rm -f "$RUNNER_TEMP/attestations.json"
            sleep 15
          done
          [ -s "$RUNNER_TEMP/attestations.json" ] || { echo "$PKG@$V attestation bundle is not served" >&2; exit 1; }
          node - "$RUNNER_TEMP/attestations.json" "$integrity" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "$WORKFLOW_PATH" <<'JS'
          'use strict';
          const fs = require('fs');
          const [file, integrity, repo, sha, ref, path] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          const slsa = (doc.attestations || []).filter((a) => a.predicateType === 'https://slsa.dev/provenance/v1');
          if (slsa.length !== 1) throw new Error('expected one SLSA provenance attestation, found ' + slsa.length);
          const st = JSON.parse(Buffer.from(slsa[0].bundle.dsseEnvelope.payload, 'base64').toString('utf8'));
          const want = Buffer.from(integrity.replace(/^sha512-/, ''), 'base64').toString('hex');
          if (!st.subject || st.subject.length !== 1 || st.subject[0].digest.sha512 !== want) throw new Error('the attested subject is not the published tarball');
          const bd = st.predicate.buildDefinition;
          const wf = bd.externalParameters.workflow;
          if (wf.repository !== 'https://github.com/' + repo) throw new Error('built from ' + wf.repository + ', not ' + repo);
          if (wf.path !== path) throw new Error('built by ' + wf.path + ', not ' + path);
          if (wf.ref !== ref) throw new Error('built from ref ' + wf.ref + ', not ' + ref);
          const src = (bd.resolvedDependencies || []).find((d) => d.digest && d.digest.gitCommit);
          if (!src || src.digest.gitCommit !== sha) throw new Error('built from commit ' + (src && src.digest.gitCommit) + ', not ' + sha);
          console.log('provenance binds ' + st.subject[0].name + ' to ' + repo + ' ' + ref + ' at ' + sha);
          JS

  sbom:
    name: sbom
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: the SBOM of the release
        run: npm sbom --package-lock-only --omit dev --sbom-format cyclonedx > "$RUNNER_TEMP/sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/sbom.cdx.json
